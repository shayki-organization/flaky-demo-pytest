name: Broken suite

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  broken-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run broken test
        run: python -m pytest broken_tests -rf
